[package]
name = "mt7996app"
version = "0.1.0"
edition = "2021"
description = "MLO-aware live dashboard for MediaTek mt7996 (Wi-Fi 7) access points"
license = "GPL-2.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
