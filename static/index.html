<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mt7996 Monitor</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1b1f24; --muted: #6a737d; --line: #e1e4e8;
  --accent: #2f6fed; --ok: #1a7f37; --warn: #b7791f; --bad: #cf222e;
  --b24: #d97706; --b5: #2f6fed; --b6: #8250df;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --other: #9aa3ad;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --fg: #e6e9ee; --muted: #8b949e; --line: #2a303a;
    --accent: #6b9bff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --b24: #f0a030; --b5: #6b9bff; --b6: #b392f0;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --other: #6b7480;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { font-size: 16px; margin: 0; }
.muted { color: var(--muted); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); }
.badge.demo { color: var(--warn); border-color: var(--warn); }
main { padding: 16px; max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.radio canvas.chart { margin-top: 2px; }
.radio .legend { margin: 10px 0 0; }
.radio .top { display: flex; justify-content: space-between; align-items: baseline; }
.band { font-weight: 600; }
.band.b24 { color: var(--b24); } .band.b5 { color: var(--b5); } .band.b6 { color: var(--b6); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 6px; font-size: 13px; }
.kv span:nth-child(odd) { color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.stack { display: flex; margin-top: 4px; } .bar.stack > i { flex: none; }
.busy { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 13px; }
.busy > span:first-child { color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
tr.sta { cursor: pointer; } tr.sta:hover { background: var(--bg); }
tr.detail > td { background: var(--bg); white-space: normal; }
.pill { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--accent); color: #fff; }
.pill.mlo { background: var(--b6); }
.sig-good { color: var(--ok); } .sig-mid { color: var(--warn); } .sig-bad { color: var(--bad); }
canvas { width: 100%; height: 70px; display: block; }
.links { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.err { color: var(--bad); margin: 0 0 4px; }
pre { margin: 0; white-space: pre-wrap; font-size: 12px; }
.hist { display: flex; align-items: flex-end; gap: 2px; height: 40px; }
.hist i { flex: 1; background: var(--accent); min-height: 1px; border-radius: 1px 1px 0 0; }
.bins { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin: 8px 0 4px; }
.bins i { flex: 1; min-width: 6px; background: var(--ok); opacity: .55; border-radius: 2px 2px 0 0; position: relative; }
.bins i.busy { background: var(--bad); opacity: .85; }
.bins i.prim { outline: 2px solid var(--accent); outline-offset: 1px; }
.bins i.punct { background: repeating-linear-gradient(45deg, var(--muted) 0 3px, transparent 3px 6px); opacity: .9; }
.row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); cursor: pointer; }
button:hover { background: var(--accent); color: #fff; }
button.warn { border-color: var(--warn); color: var(--warn); } button.warn:hover { background: var(--warn); color: #fff; }
.ev { font-size: 12px; max-height: 260px; overflow-y: auto; }
.ev div { padding: 2px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.ev .t { color: var(--muted); white-space: nowrap; } .ev .k { min-width: 64px; color: var(--muted); }
.ev .warn { color: var(--warn); } .ev .error { color: var(--bad); }
.ctl { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--warn); color: var(--warn); font-size: 12px; }
#toast { position: fixed; right: 12px; bottom: 12px; max-width: 420px; padding: 8px 12px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 10px #0004; font-size: 12px; white-space: pre-wrap; }
#toast.bad { border-color: var(--bad); }
.pane { display: grid; gap: 16px; } .pane[hidden] { display: none; }
nav.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
nav.tabs button { border: 0; border-radius: 0; color: var(--fg); padding: 4px 16px; font-size: 13px; }
nav.tabs button + button { border-left: 1px solid var(--line); }
nav.tabs button:hover { background: var(--bg); color: var(--fg); }
nav.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.bar-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; color: var(--fg); padding: 4px 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--bg); color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
canvas.chart { height: 150px; touch-action: pan-y; outline-offset: 2px; }
canvas.chart.sm { height: 110px; }
.pt { font-size: 12px; margin: 10px 0 2px; } .pt:first-of-type { margin-top: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 10px 0 4px; }
.legend button.lg { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 1px 8px; }
.legend button.lg:hover { background: var(--bg); color: var(--fg); }
.legend button.lg.off { opacity: .45; text-decoration: line-through; }
.legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.legend .lv { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend.static { align-items: center; font-size: 12px; }
.legend.static b { font-weight: 500; margin-right: 6px; }
.legend.static span { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 1px 6px; }
table.mini { width: auto; font-size: 12px; margin-top: 8px; }
table.mini th, table.mini td { padding: 3px 12px; }
#tip { position: fixed; z-index: 10; pointer-events: none; min-width: 200px; max-width: 360px; padding: 8px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 16px #0005; font-size: 12px; }
#tip .th { color: var(--muted); margin-bottom: 4px; }
#tip table { width: 100%; } #tip th, #tip td { padding: 1px 0 1px 12px; border: 0; }
#tip th:first-child, #tip td:first-child { padding-left: 0; text-align: left; white-space: normal; }
#tip td.n { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
#tip th { text-align: right; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
#tip .k { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
#tip tr.tot td { border-top: 1px solid var(--line); padding-top: 3px; }
#tip .ev { color: var(--warn); margin-top: 4px; max-height: none; overflow: visible; display: block; }
@media (max-width: 600px) { main { padding: 10px; } }
</style>
</head>
<body>
<header>
  <h1>mt7996 Monitor</h1>
  <span id="host" class="muted"></span>
  <span id="demo" class="badge demo" hidden>demo data</span>
  <span id="upd" class="muted"></span>
  <span id="ctl" class="ctl" hidden></span>
  <nav class="tabs" role="tablist" style="margin-left:auto">
    <button role="tab" data-tab="live">Live</button><button role="tab" data-tab="history">History</button>
  </nav>
</header>
<main>
  <div id="errors"></div>
  <div id="toast" hidden></div>
  <div id="tip" hidden></div>
  <div id="tab-live" class="pane">
    <section><h2>Radios / links</h2><div id="radios" class="grid"></div></section>
    <div id="liveCharts" class="pane"></div>
    <section class="card"><h2>Stations</h2><div class="scroll"><table id="stas"></table></div></section>
    <section class="card"><h2>Channel planner / puncturing <span class="muted" style="text-transform:none">(advice from the scan cache)</span></h2>
      <div id="plan"></div></section>
    <section class="card"><h2>Airtime fairness</h2><div class="scroll"><table id="air"></table></div></section>
    <section class="card"><h2>Band steering (single-link clients)</h2><div class="scroll"><table id="steer"></table></div></section>
    <section class="card"><h2>Events (DFS, firmware, channel changes, joins, control audit)</h2><div id="events" class="ev"></div></section>
    <section class="card"><h2>Hardware: TX per band</h2><div id="tx" class="grid"></div></section>
    <section class="card"><h2>Hardware queues / TWT / DFS</h2><div id="misc"></div></section>
  </div>
  <div id="tab-history" class="pane" hidden>
    <div id="histCharts" class="pane"></div>
    <p class="muted" id="histNote"></p>
  </div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (v, d = 1, u = "") => v == null ? "–" : (+v).toFixed(d).replace(/\.0+$/, "") + u;
const bandCls = b => b === "2.4G" ? "b24" : b === "5G" ? "b5" : "b6";
const sigCls = s => s == null ? "" : s >= -60 ? "sig-good" : s >= -72 ? "sig-mid" : "sig-bad";
const open = new Set();   // expanded station MACs
let hist = {};

function rateStr(r) {
  if (!r) return "–";
  const p = r.proto ? "11" + r.proto + " " : "";
  const bits = [r.mcs != null ? "MCS" + r.mcs : null, r.nss ? r.nss + "ss" : null, r.width ? r.width + "MHz" : null].filter(Boolean);
  return esc(fmt(r.mbps, 0) + " Mb/s · " + p + bits.join(" "));
}

function spark(canvas, series, color) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr);
  const cs = getComputedStyle(document.body);
  g.strokeStyle = cs.getPropertyValue("--line"); g.beginPath(); g.moveTo(0, h - .5); g.lineTo(w, h - .5); g.stroke();
  if (!series || series.length < 2) return;
  const t0 = series[0][0], t1 = series[series.length - 1][0];
  const vs = series.map(p => p[1]), lo = Math.min(...vs), hi = Math.max(...vs, lo + 1e-9);
  g.strokeStyle = cs.getPropertyValue(color); g.lineWidth = 1.5; g.beginPath();
  series.forEach(([t, v], i) => {
    const x = (t - t0) / Math.max(1e-9, t1 - t0) * (w - 2) + 1, y = h - 4 - (v - lo) / (hi - lo) * (h - 10);
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
  g.fillStyle = cs.getPropertyValue("--muted"); g.font = "10px system-ui";
  g.fillText(fmt(hi, 1), 2, 10); g.fillText(fmt(lo, 1), 2, h - 5);
}

/** "Busy 66 %" with a bar split like the airtime graph below it: TX, RX, other busy. */
function busyBar(r) {
  const b = Math.min(100, r.busy_pct || 0), tx = Math.min(r.tx_pct || 0, b), rx = Math.min(r.rx_pct || 0, b - tx), other = Math.max(0, b - tx - rx);
  return `<div class="busy"><span>Channel busy</span><span><b>${fmt(r.busy_pct, 1, " %")}</b>
      <span class="muted">(tx ${fmt(r.tx_pct, 1)} / rx ${fmt(r.rx_pct, 1)})</span></span></div>
    <div class="bar stack" role="img" aria-label="Channel busy ${fmt(r.busy_pct, 1, " %")}" title="Share of the time the channel was busy in the last sample: TX, RX and other busy">
      <i style="width:${tx}%;background:var(--s1)"></i><i style="width:${rx}%;background:var(--s3)"></i><i style="width:${other}%;background:var(--other)"></i></div>`;
}
const radioCards = [];   // {text, panel} per radio box, in state order
let radioSig = "";
function renderRadios(st) {
  const host = $("radios"), sig = st.radios.map(r => [r.iface, r.link, r.history_key].join("/")).join("|");
  if (sig !== radioSig) {   // rebuild only when the set of links changes: the canvases keep their hover handlers
    radioSig = sig; radioCards.length = 0; host.replaceChildren();
    for (const r of st.radios) {
      const card = document.createElement("div"), text = document.createElement("div");
      card.className = "card radio"; card.append(text);
      let panel = null;
      if (r.history_key) {
        const cv = utilCanvas(r), lg = document.createElement("div");
        lg.innerHTML = utilLegend("Airtime busy (%)"); card.append(lg.firstElementChild, cv);
        panel = utilPanel(cv, r.history_key.replace(/:busy$/, ""), () => [600, null]);
      }
      host.append(card); radioCards.push({text, panel});
    }
    if (!st.radios.length) host.innerHTML = '<div class="muted">no interfaces</div>';
  }
  st.radios.forEach((r, i) => {
    radioCards[i].text.innerHTML = `
      <div class="top"><span><span class="band ${bandCls(r.band)}">${esc(r.band)}</span>
        ch ${esc(r.channel)} · ${esc(r.width)} MHz</span>
        <span class="muted">${esc(r.iface)}${r.link != null ? " · link " + esc(r.link) : ""}</span></div>
      <div class="muted">${esc(r.freq)} MHz${r.ssid ? " · " + esc(r.ssid) : ""}</div>
      <div class="kv">
        <span>TX power</span><span>${fmt(r.txpower, 1, " dBm")}</span>
        <span>Noise</span><span>${fmt(r.noise, 0, " dBm")}</span>
        <span>Stations</span><span>${r.stations}${r.stations_unlinked ? ` <span class="muted">(+${r.stations_unlinked} link unknown)</span>` : ""}</span>
      </div>
      ${busyBar(r)}`;
    radioCards[i].panel?.update();
  });
}

function linkCard(s, l) {
  const k = `sta:${s.mac}:l${l.id}`;
  return `<div class="card">
    <div><span class="band ${bandCls(l.band)}">${esc(l.band || "link")}</span> link ${l.id}
      <span class="muted">${l.channel != null ? "ch " + esc(l.channel) : ""} ${esc(l.addr || "")}</span></div>
    <div class="kv">
      <span>Signal</span><span class="${sigCls(l.signal)}">${fmt(l.signal, 0, " dBm")} <span class="muted">(SNR ${fmt(l.snr, 0, " dB")})</span></span>
      <span>TX</span><span>${fmt(l.mbps_tx, 1, " Mb/s")}</span>
      <span>Retries</span><span>${fmt(l.retry_pct, 1, " %")}</span>
      <span>Rate</span><span>${rateStr(l.tx_rate)}</span>
    </div>
    <canvas data-h="${esc(k + ":tx")}" data-c="--${bandCls(l.band)}"></canvas></div>`;
}

function renderStas(st) {
  let h = `<tr><th>Station</th><th>Iface</th><th class="num">Signal</th><th class="num">SNR</th><th class="num">TX Mb/s</th>
    <th class="num">RX Mb/s</th><th class="num">Retry %</th><th>TX rate</th><th>Links</th></tr>`;
  for (const s of st.stations) {
    const exp = open.has(s.mac);
    h += `<tr class="sta" data-mac="${esc(s.mac)}"><td>${exp ? "▾" : "▸"} ${esc(s.mac)}
      ${s.mlo ? '<span class="pill mlo">MLO</span>' : ""}</td><td>${esc(s.iface)}</td>
      <td class="num ${sigCls(s.signal)}">${fmt(s.signal, 0)}</td><td class="num">${fmt(s.snr, 0)}</td>
      <td class="num">${fmt(s.mbps_tx, 1)}</td><td class="num">${fmt(s.mbps_rx, 1)}</td>
      <td class="num">${fmt(s.retry_pct, 1)}</td><td>${rateStr(s.tx_rate)}</td>
      <td>${s.links.map(l => `<span class="band ${bandCls(l.band)}">${esc(l.band || l.id)}</span>`).join(" ") || "–"}</td></tr>`;
    if (exp) {
      h += `<tr class="detail"><td colspan="9">
        <div class="muted">connected ${fmt(s.connected_s, 0, " s")} · inactive ${fmt(s.inactive_ms, 0, " ms")}
          · chains ${esc((s.chains || []).join(", ") || "–")}${s.airtime_weight ? " · airtime weight " + s.airtime_weight : ""} · ${s.authorized ? "authorized" : ""}</div>
        <div class="links" style="margin-top:8px">
          <div class="card"><div>total throughput</div>
            <canvas data-h="sta:${esc(s.mac)}:tx" data-c="--accent"></canvas></div>
          <div class="card"><div>signal</div>
            <canvas data-h="sta:${esc(s.mac)}:sig" data-c="--accent"></canvas></div>
          <div class="card"><div>SNR (dB)</div>
            <canvas data-h="sta:${esc(s.mac)}:snr" data-c="--accent"></canvas></div>
          ${s.links.map(l => linkCard(s, l)).join("")}
        </div></td></tr>`;
    }
  }
  $("stas").innerHTML = st.stations.length ? h : '<tr><td class="muted">no stations associated</td></tr>';
}

function renderHw(st) {
  const txs = st.hw.flatMap(h => h.tx.map(t => ({...t, dev: h.phy})));
  $("tx").innerHTML = txs.map(t => {
    const am = t.amsdu || [], tot = am.reduce((a, b) => a + b, 0) || 1;
    return `<div class="card"><b>${esc(t.phy)}</b> <span class="muted">band ${t.band}</span>
      <div class="kv"><span>Attempts</span><span>${esc(t.attempts)}</span>
      <span>Success</span><span>${esc(t.success)}</span>
      <span>PER</span><span>${fmt(t.per, 0, " %")}</span><span>BA miss</span><span>${esc(t.ba_miss)}</span></div>
      <div class="bar"><i style="width:${Math.min(100, t.per || 0)}%;background:var(--bad)"></i></div>
      <div class="muted" style="margin-top:6px">A-MSDU size histogram</div>
      <div class="hist">${am.map((v, i) => `<i title="${i + 1} MSDU: ${v}" style="height:${Math.max(2, v / tot * 100)}%"></i>`).join("")}</div></div>`;
  }).join("") || '<div class="muted">no tx_stats (debugfs unreadable?)</div>';

  let m = "";
  for (const h of st.hw) {
    if (h.queues.length) m += `<h2>${esc(h.phy)} xmit queues</h2><div class="scroll"><table><tr><th>queue</th><th class="num">queued</th><th class="num">head</th><th class="num">tail</th></tr>` +
      h.queues.map(q => `<tr><td>${esc(q.queue)}</td><td class="num">${q.queued}</td><td class="num">${q.head}</td><td class="num">${q.tail}</td></tr>`).join("") + "</table></div>";
    if (h.twt.length) m += `<h2 style="margin-top:12px">TWT flows</h2><div class="scroll"><table><tr><th class="num">wcid</th><th class="num">id</th><th>flags</th><th class="num">exp</th><th class="num">mantissa</th><th class="num">duration</th></tr>` +
      h.twt.map(t => `<tr><td class="num">${t.wcid}</td><td class="num">${t.id}</td><td>${esc(t.flags)}</td><td class="num">${t.exp}</td><td class="num">${t.mantissa}</td><td class="num">${t.duration}</td></tr>`).join("") + "</table></div>";
    if (h.rdd) m += `<h2 style="margin-top:12px">DFS background radar (rdd_monitor)</h2><pre>${esc(h.rdd)}</pre>`;
  }
  $("misc").innerHTML = m || '<div class="muted">nothing to show</div>';
}

function drawSparks() {
  document.querySelectorAll("canvas[data-h]").forEach(c => spark(c, hist[c.dataset.h], c.dataset.c));
}


// ------------------------------------------------------------- charts ----
// Stacked-bar time series on canvas, shared by the Live and History tabs. A range is served from the
// raw 2 s samples (tier null) or from one of the daemon's averaged tiers; columns are re-bucketed to ~5 px.
const TIER = {"1m": {secs: 60, every: 30e3, finer: null}, "10m": {secs: 600, every: 120e3, finer: "1m"}, "1h": {secs: 3600, every: 300e3, finer: "10m"}};
const tierData = {};                   // name -> {data: {key: [[t, v]]}, at}
const BAND_ORDER = ["2.4G", "5G", "6G", "MLD", "?"];
const BAND_VAR = {"2.4G": "--b24", "5G": "--b5", "6G": "--b6"};
const NSLOT = 7;                       // categorical colors; the rest folds into "Other"
let srvNow = Date.now() / 1000, pollSec = 2, lastSt = null;
const cssv = n => getComputedStyle(document.body).getPropertyValue(n).trim();
const trimZ = t => t.includes(".") ? t.replace(/0+$/, "").replace(/\.$/, "") : t;

/** Airtime busy of one link as stacked tx / rx / other bars. rng() -> [seconds, tier]; update() redraws. */
function utilPanel(cv, key, rng) {
  const o = {cv, key, hover: -1, xlabels: true, fmtY: fmtPct, colors: ["--s1", "--s3", "--other"]};
  o.update = () => {
    if (o.hover >= 0) return;   // frozen while the pointer is on it
    const [secs, tier] = rng(), g = makeGrid(cv.clientWidth - 64, srvNow, secs, tier);
    o.g = g; o.busy = bucket(points(key + ":busy", tier), g); o.tx = bucket(points(key + ":tx", tier), g); o.rx = bucket(points(key + ":rx", tier), g);
    o.has = o.busy.map(v => !Number.isNaN(v));
    o.stacks = i => [o.tx[i] || 0, o.rx[i] || 0, Math.max(0, o.busy[i] - (o.tx[i] || 0) - (o.rx[i] || 0))];

        <td class="num">${fmtVol(b[0])}</td><td class="num">${fmtRate(b[1])}</td><td class="num">${fmtRate(b[2])}</td></tr>`;
    }
    R("table").innerHTML = tm.defs.length ? h + "</table>" : '<div class="muted">no data yet</div>';
  }
  function renderLegend() {
    const lg = R("legend"), sig = tm.defs.map(d => d.id + (hidden.has(d.id) ? "-" : "+") + d.color).join("|");
    if (sig !== legendSig) {
      legendSig = sig;
      lg.replaceChildren(...tm.defs.map(d => {
        const b = document.createElement("button"), sw = document.createElement("i"), nm = document.createElement("span"), v = document.createElement("span");
        b.className = "lg" + (hidden.has(d.id) ? " off" : ""); b.setAttribute("aria-pressed", String(!hidden.has(d.id)));
        sw.className = "sw"; sw.style.background = `var(${d.color})`; nm.textContent = d.label; v.className = "lv";
        b.append(sw, nm, v);
        b.addEventListener("click", () => { hidden.has(d.id) ? hidden.delete(d.id) : hidden.add(d.id); renderTraffic(); });
        return b;
      }));
      if (!tm.defs.length) lg.innerHTML = '<span class="muted">collecting data…</span>';
    }
    lg.querySelectorAll("button.lg").forEach((b, i) => {
      const d = tm.defs[i];
      if (d) b.querySelector(".lv").textContent = "↓ " + fmtVol(sumOf(d.tx) * tm.g.colSec / 8) + "  ↑ " + fmtVol(sumOf(d.rx) * tm.g.colSec / 8);
    });
  }
  function renderTraffic() {
    const w = tp.down.cv.clientWidth;
    if (!w) return;
    tm = model(w - 64);
    renderLegend(); renderStats(); drawTraffic();
    const first = tm.has.indexOf(true);
    R("coverage").textContent = first < 0 ? "no data yet" : first > 1 ? "history starts " + stamp(tm.g.t0 + first * tm.g.colSec, {...tm.g, colSec: 60}) : "";
  }

  // channel load: one stacked panel per radio link (tx / rx / other busy)
  function renderUtil() {
    const uh = R("util");
    if (!uh || !lastSt) return;
    const rs = lastSt.radios.filter(r => r.history_key), sig = rs.map(r => r.history_key).join("|");
    if (sig !== utilSig) {
      utilSig = sig; util.clear(); uh.replaceChildren();
      for (const r of rs) {
        const card = document.createElement("div"), t = document.createElement("div"), cv = utilCanvas(r);
        card.className = "card";
        t.innerHTML = `<span class="band ${bandCls(r.band)}">${esc(r.band)}</span> ch ${esc(r.channel)} · ${esc(r.width)} MHz <span class="muted">${esc(r.iface)}${r.link != null ? " · link " + esc(r.link) : ""}</span>`;
        card.append(t, cv); uh.append(card);
        util.set(r.history_key, utilPanel(cv, r.history_key.replace(/:busy$/, ""), () => [range()[1], tier()]));
      }
      if (!rs.length) uh.innerHTML = '<div class="muted">no survey data</div>';
    }
    for (const o of util.values()) o.update();
  }

  const need = () => { const out = []; for (let t = tier(); t; t = TIER[t].finer) out.push(t); return out; };
  const visible = () => host.offsetParent !== null;
  const view = {
    async refresh(force) {
      if (!visible()) return;
      await Promise.all(need().map(t => fetchTier(t, force)));
      if (thover < 0) renderTraffic();   // frozen while the pointer is on a traffic chart
      renderUtil();
    },
    redraw() { if (!visible()) return; if (thover < 0) renderTraffic(); renderUtil(); },
  };
  const seg = (name, items, cur, set) => {
    const box = R(name);
    items.forEach(([val, label]) => {
      const b = document.createElement("button"); b.textContent = label;
      b.addEventListener("click", () => { set(val); save(); sync(); syncAll(); view.refresh(true); });
      box.append(b);
    });
    const sync = () => box.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(items[i][0] === cur())));
    sync(); return sync;
  };
  const syncR = seg("range", ranges.map((r, i) => [i, r[0]]), () => ui.range, v => { ui.range = v; });
  const syncG = seg("group", [["band", "By band"], ["sta", "By station"]], () => ui.group, v => { ui.group = v; });
  const syncAll = () => { syncR(); syncG(); };
  views.push(view);
  return view;
}

// the Live tab shows the airtime graphs inside the radio boxes instead of a separate section
const liveView = ChartView($("liveCharts"), "live", [["10 min", 600, null], ["1 h", 3600, "1m"]], 0, {util: false});
const histView = ChartView($("histCharts"), "history", [["6 h", 21600, "1m"], ["24 h", 86400, "1m"], ["7 days", 604800, "10m"], ["30 days", 2592000, "10m"], ["1 year", 31536000, "1h"]], 1);

// ---- tabs
function showTab(name) {
  if (name !== "live" && name !== "history") name = "live";
  $("tab-live").hidden = name !== "live"; $("tab-history").hidden = name !== "history";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  try { sessionStorage.setItem("mt7996tab", name); } catch (e) {}
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  (name === "live" ? liveView : histView).refresh(false);
  if (name === "live") drawSparks();
}
document.querySelector("nav.tabs").addEventListener("click", ev => { const b = ev.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
addEventListener("hashchange", () => showTab(location.hash.slice(1)));

// ------------------------------------------------------------ control ----
let ctlInfo = {enabled: false, dry_run: false};
const toast = (msg, bad) => {
  const t = $("toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 9000);
};
function token() {
  let t = ""; try { t = sessionStorage.getItem("mt7996tok") || ""; } catch (e) {}
  if (!t) { t = prompt("Control token (as in --control-token-file):") || ""; try { sessionStorage.setItem("mt7996tok", t); } catch (e) {} }
  return t;
}
async function control(action, confirmText) {
  if (!confirm((confirmText || "Run this action?") + "\n\n" + JSON.stringify(action) + (ctlInfo.dry_run ? "\n\n(dry-run: nothing will be changed)" : ""))) return;
  const r = await fetch("/api/control", {method: "POST", headers: {"X-Token": token(), "Content-Type": "application/json"}, body: JSON.stringify(action)});
  const j = await r.json().catch(() => ({ok: false, error: "bad response"}));
  if (r.status === 401) { try { sessionStorage.removeItem("mt7996tok"); } catch (e) {} }
  toast(j.ok ? (j.output || "ok") : "failed: " + j.error, !j.ok);
}
const btn = (label, action, confirmText, cls) => ctlInfo.enabled
  ? `<button class="${cls || ""}" data-act="${esc(JSON.stringify(action))}" data-confirm="${esc(confirmText || "")}">${esc(label)}${ctlInfo.dry_run ? " (dry-run)" : ""}</button>` : "";
document.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-act]");
  if (b) control(JSON.parse(b.dataset.act), b.dataset.confirm);
});

// ------------------------------------------------------------- planner ----
function renderPlan(st) {
  const p = st.plan;
  if (!p) { $("plan").innerHTML = '<div class="muted">no plan yet</div>'; return; }
  const ifaces = [...new Set(st.radios.map(r => r.iface))];
  let h = `<div class="row muted">${p.scan_age_s != null ? "scan cache age " + fmt(p.scan_age_s, 0, " s") : "no scan data"}
    ${ifaces.map(i => btn("Trigger scan on " + i, {action: "scan", iface: i}, "Triggering a scan makes the AP leave its channel briefly and may disturb clients.", "warn")).join(" ")}</div>
    ${p.notes.map(n => `<p class="muted">• ${esc(n)}</p>`).join("")}<div class="grid" style="margin-top:8px">`;
  for (const l of p.links) {
    const pun = l.puncture ? l.puncture.bitmap : 0;
    const strip = l.bins.map((b, i) => `<i class="${b.busy ? "busy" : ""} ${b.primary ? "prim" : ""} ${pun & (1 << i) ? "punct" : ""}"
      style="height:${Math.max(8, Math.min(100, 12 + b.load * 40))}%"
      title="${b.freq} MHz · ${b.neighbors} neighbor(s)${b.strongest != null ? " · strongest " + fmt(b.strongest, 0) + " dBm" : ""}${b.primary ? " · primary" : ""}${pun & (1 << i) ? " · punctured" : ""}"></i>`).join("");
    h += `<div class="card"><div><span class="band ${bandCls(l.band)}">${esc(l.band)}</span> ch ${esc(l.channel)} · ${l.width} MHz
      <span class="muted">${esc(l.iface)}${l.link != null ? " · link " + l.link : ""}</span></div>
      <div class="bins">${strip}</div>
      <div class="muted">20 MHz subchannels (red = neighbor heard ≥ −82 dBm, outlined = primary, hatched = recommended puncture)</div>
      <div class="kv"><span>Usable now</span><span>${l.clear_mhz} MHz of ${l.width}</span><span>Interference</span><span>${fmt(l.current_score, 2)}</span></div>`;
    if (l.puncture) {
      const a = {action: "chan_switch", iface: l.iface, link: l.link, freq: l.freq, center1: l.center1, bandwidth: l.width, punct: l.puncture.bitmap};
      h += `<p><b>Puncture ${esc(l.puncture.bitmap_hex)}</b> (${l.puncture.punctured_freqs.join(", ")} MHz): ${l.puncture.clear_before_mhz} → ${l.puncture.clear_after_mhz} MHz usable (+${l.puncture.gain_mhz})
        ${btn("Apply puncturing", a, "Switches this link with hostapd chan_switch; clients may briefly disconnect.", "warn")}</p>`;
    } else if (l.puncture_note) h += `<p class="muted">Puncturing: ${esc(l.puncture_note)}</p>`;
    if (l.recommend) {
      const c = l.recommend;
      const a = {action: "chan_switch", iface: l.iface, link: l.link, freq: c.freq, center1: c.center1, bandwidth: c.width};
      h += `<p><b>Move to ch ${esc(c.channel)} (${c.freq} MHz)</b>: interference ${fmt(c.score, 2)} vs ${fmt(l.current_score, 2)} now — ${esc(c.reason)}
        ${btn("Apply channel", a, "Switches channel with hostapd chan_switch; clients may briefly disconnect.", "warn")}</p>`;
    } else h += `<p class="muted">Current channel is among the best for this width.</p>`;
    if (l.candidates.length) h += `<details><summary class="muted">candidates</summary><table><tr><th>ch</th><th class="num">score</th><th>notes</th></tr>` +
      l.candidates.map(c => `<tr><td>${esc(c.channel ?? c.freq)}${c.current ? " (now)" : ""}</td><td class="num">${fmt(c.score, 2)}</td><td>${esc(c.reason)}</td></tr>`).join("") + `</table></details>`;
    h += "</div>";
  }
  $("plan").innerHTML = h + "</div>";
}

// ------------------------------------------------------------- airtime ----
function renderAirtime(st) {
  if (!st.airtime.length) { $("air").innerHTML = '<tr><td class="muted">collecting airtime data (needs two samples and iw "tx/rx duration")</td></tr>'; return; }
  let h = `<tr><th>Station</th><th class="num">Airtime %</th><th class="num">Mb/s</th><th class="num">Mb/s per %</th><th class="num">Weight</th><th>Status</th><th></th></tr>`;
  for (const a of st.airtime) {
    const act = a.hog && a.weight !== a.suggested ? btn("Throttle to " + a.suggested, {action: "set_airtime", iface: a.iface, mac: a.mac, weight: a.suggested}, "Lower this client's airtime weight.", "warn")
      : (a.weight != null && a.weight !== 256 ? btn("Restore 256", {action: "set_airtime", iface: a.iface, mac: a.mac, weight: 256}, "Restore the default airtime weight.") : "");
    h += `<tr><td>${esc(a.mac)}</td><td class="num">${fmt(a.share_pct, 1)}</td><td class="num">${fmt(a.mbps, 1)}</td><td class="num">${fmt(a.efficiency, 2)}</td>
      <td class="num">${a.weight ?? "–"}</td><td class="${a.hog ? "sig-bad" : ""}">${a.hog ? "hogging: " : ""}${esc(a.reason)}${a.throttled ? " (throttled)" : ""}</td><td>${act}</td></tr>`;
  }
  $("air").innerHTML = h;
}

// ------------------------------------------------------------ steering ----
function renderSteer(st) {
  if (!st.steering.length) { $("steer").innerHTML = '<tr><td class="muted">no steering candidates (single-link clients on a congested link with a quiet higher band)</td></tr>'; return; }
  let h = `<tr><th>Station</th><th>Move</th><th>Why</th><th>Confidence</th><th></th></tr>`;
  for (const a of st.steering) {
    const act = btn("Send BTM request", {action: "btm", iface: a.iface, mac: a.mac, neighbor: a.neighbor}, "Ask this client to roam; it may ignore or accept.", "warn");
    h += `<tr><td>${esc(a.mac)}</td><td><span class="band ${bandCls(a.from_band)}">${esc(a.from_band)}</span> → <span class="band ${bandCls(a.to_band)}">${esc(a.to_band)}</span></td>
      <td style="white-space:normal">${esc(a.reason)}</td><td>${esc(a.confidence)}</td>
      <td>${a.cooldown_left_s > 0 ? "cooldown " + a.cooldown_left_s + " s" : act}</td></tr>`;
  }
  $("steer").innerHTML = h;
}

// -------------------------------------------------------------- events ----
let events = [], lastEv = 0;
async function pollEvents() {
  const j = await (await fetch("/api/events?since=" + lastEv, {cache: "no-store"})).json();
  if (j.length) { lastEv = j[j.length - 1].id; events = events.concat(j).slice(-300); }
  $("events").innerHTML = events.slice().reverse().map(e => `<div><span class="t">${new Date(e.ts * 1000).toLocaleTimeString()}</span>
    <span class="k">${esc(e.kind)}</span><span class="${esc(e.level)}">${esc(e.msg)}</span></div>`).join("") || '<span class="muted">no events yet</span>';
}

function renderCtl(st) {
  ctlInfo = st.control || {enabled: false};
  const c = $("ctl"); c.hidden = !ctlInfo.enabled;
  c.textContent = "control enabled" + (ctlInfo.dry_run ? " · dry-run" : "") + (ctlInfo.airtime_auto ? " · airtime auto" : "") + (ctlInfo.steer_auto ? " · steering auto" : "");
}

async function tick() {
  let next = 2000;
  try {
    const st = await (await fetch("/api/state", {cache: "no-store"})).json();
    next = Math.max(500, (st.interval || 2) * 1000);
    hist = await (await fetch("/api/history", {cache: "no-store"})).json();
    lastSt = st; srvNow = st.ts || srvNow; pollSec = st.interval || 2;
    $("host").textContent = st.host;
    $("demo").hidden = !st.demo;
    $("upd").textContent = st.ts ? "updated " + new Date(st.ts * 1000).toLocaleTimeString() : "";
    $("errors").innerHTML = st.errors.map(e => `<p class="err">⚠ ${esc(e)}</p>`).join("");
    renderCtl(st); renderRadios(st); renderStas(st); renderPlan(st); renderAirtime(st); renderSteer(st); renderHw(st);
    await pollEvents().catch(() => {});
    drawSparks();
    for (const v of views) await v.refresh(false);
  } catch (e) {
    $("errors").innerHTML = `<p class="err">⚠ cannot reach daemon: ${esc(e.message)}</p>`;
  }
  setTimeout(tick, next);
}

$("stas").addEventListener("click", ev => {
  const tr = ev.target.closest("tr.sta");
  if (!tr) return;
  const mac = tr.dataset.mac;
  open.has(mac) ? open.delete(mac) : open.add(mac);
  // re-render immediately from the last fetch
  fetch("/api/state").then(r => r.json()).then(st => { renderStas(st); drawSparks(); });
});
addEventListener("resize", () => { drawSparks(); views.forEach(v => v.redraw()); });
let startTab = "live";
try { startTab = sessionStorage.getItem("mt7996tab") || "live"; } catch (e) {}
showTab(location.hash.slice(1) || startTab);
tick();
</script>
